<style>
/* Layout: an accountant's analysis pad — header + tabs, then panels; figures ride ruled columns in a mono face */
:root{
  --paper:#F4F7F4; --sheet:#FFFFFF; --ink:#18232E; --ink-2:#4A5865; --ink-3:#7A8792;
  --rule:#D5E2D8; --rule-strong:#AFC6B5; --tint:#EAF1EB;
  --accent:#23466E; --accent-ink:#FFFFFF; --accent-soft:#E3EAF3;
  --rev:#16855A; --exp:#7A5BC9;
  --good:#2E7D4F; --good-soft:#E2F1E7; --warn:#A8670F; --warn-soft:#F8EBD6; --crit:#B3392F; --crit-soft:#F7E2DF;
  --shadow:0 1px 0 rgba(24,35,46,.04),0 6px 24px -12px rgba(24,35,46,.18);
  --f-ui:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Spline Sans Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1519; --sheet:#151D22; --ink:#DCE5E0; --ink-2:#A5B3AD; --ink-3:#77867F;
  --rule:#24312C; --rule-strong:#355045; --tint:#18241F;
  --accent:#8FB2E0; --accent-ink:#0F1519; --accent-soft:#1C2836;
  --rev:#3FA877; --exp:#9C82E0;
  --good:#5DBB84; --good-soft:#16271E; --warn:#E0A64F; --warn-soft:#2A2114; --crit:#E8786C; --crit-soft:#2C1815;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1519; --sheet:#151D22; --ink:#DCE5E0; --ink-2:#A5B3AD; --ink-3:#77867F;
  --rule:#24312C; --rule-strong:#355045; --tint:#18241F;
  --accent:#8FB2E0; --accent-ink:#0F1519; --accent-soft:#1C2836;
  --rev:#3FA877; --exp:#9C82E0;
  --good:#5DBB84; --good-soft:#16271E; --warn:#E0A64F; --warn-soft:#2A2114; --crit:#E8786C; --crit-soft:#2C1815;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;flex-direction:column;gap:6px;padding-block:14px 0}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:space-between}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.01em}
.brand .co{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.fy-chip{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prov{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:999px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs a{padding:10px 12px;color:var(--ink-2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-strong);background:var(--sheet);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--tint)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}

main{padding-block:22px 64px;display:flex;flex-direction:column;gap:22px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-h h2{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
.section-h p{margin:2px 0 0;color:var(--ink-3);font-size:13px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

.monthnav{display:flex;align-items:center;gap:4px}
.monthnav .lbl{min-width:132px;text-align:center;font-weight:600}
.iconbtn{border:1px solid var(--rule);background:var(--sheet);width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);border-color:var(--rule-strong)}

/* KPI strip: one ruled sheet split into columns, like a pad */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.kpi{padding:16px 18px;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(19px,2.4vw,25px);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.kpi .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:1px}
.neg{color:var(--crit)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--rule)}}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{margin:0;font-size:15px;font-weight:600}
.panel .sub{color:var(--ink-3);font-size:12.5px;margin:2px 0 0}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* chart */
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-num);font-size:10.5px;fill:var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 10px;border-radius:8px;font-size:12px;min-width:170px;box-shadow:var(--shadow);transform:translate(-50%,-100%);white-space:nowrap;z-index:2}
.tip b{display:block;margin-bottom:4px;font-family:var(--f-ui)}
.tip .row{display:flex;justify-content:space-between;gap:16px;font-family:var(--f-num)}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* breakdown bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:13.5px}
.bar-row .track{grid-column:1/-1;height:6px;background:var(--tint);border-radius:3px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:3px}
.bar-row .amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.empty-note{color:var(--ink-3);font-size:13.5px;padding:8px 0}

/* attention + compliance list */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--rule)}
.li:first-child{border-top:0;padding-top:0}
.li .body{flex:1;min-width:0}
.li .t{font-weight:500}
.li .d{font-size:12.5px;color:var(--ink-3)}
.li .r{font-family:var(--f-num);font-size:13px;white-space:nowrap;text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill.draft{background:var(--tint);color:var(--ink-2)}
.pill.sent{background:var(--accent-soft);color:var(--accent)}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.overdue{background:var(--crit-soft);color:var(--crit)}
.pill.void{background:var(--tint);color:var(--ink-3);text-decoration:line-through}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.meter{height:8px;background:var(--tint);border-radius:4px;overflow:hidden}
.meter div{height:100%;background:var(--accent);border-radius:4px}

/* start panel */
.start{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;background:var(--sheet);border:1px dashed var(--rule-strong);border-radius:12px}
.start > div{padding:18px;border-left:1px dashed var(--rule-strong);display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.start > div:first-child{border-left:0}
.start h4{margin:0;font-size:14.5px}
.start p{margin:0;color:var(--ink-2);font-size:13.5px}
@media (max-width:760px){.start{grid-template-columns:minmax(0,1fr)}.start>div{border-left:0;border-top:1px dashed var(--rule-strong)}.start>div:first-child{border-top:0}}

/* ledger table: column rules like an analysis pad, double rule under totals */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:8px;padding:7px 10px;font-size:13.5px;min-width:0}
.filters input{flex:1 1 180px}
.tbl-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--rule-strong);background:var(--tint);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
td+td,th+th{border-left:1px solid var(--rule)}
th.r,td.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--tint)}
td .main{font-weight:500}
td .meta{font-size:12px;color:var(--ink-3)}
td.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:600;border-bottom:0;cursor:default}
tfoot td.amt{border-bottom:3px double var(--ink-2)}
.src{font-size:11px;color:var(--ink-3);border:1px solid var(--rule-strong);border-radius:4px;padding:0 5px;white-space:nowrap}
.rcpt-missing{color:var(--warn);font-size:12px;white-space:nowrap}
.rcpt-ok{color:var(--good);font-size:12px;white-space:nowrap}
.rcpt-ok a{color:inherit}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* setup */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media (max-width:600px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-3)}
.field input,.field select,.field textarea{border:1px solid var(--rule-strong);background:var(--sheet);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;font-weight:500;color:var(--ink-2)}
@media (max-width:600px){.seg button{padding:7px 11px;font-size:13.5px;white-space:nowrap}}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
@media (max-width:600px){.cat-list{grid-template-columns:minmax(0,1fr)}}
.cat-list div{font-size:13px}
.cat-list b{display:block;font-weight:600;font-size:13.5px}
.cat-list span{color:var(--ink-3)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,20,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);width:min(640px,100%);display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--rule);gap:12px}
.modal-h h3{margin:0;font-size:17px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--rule);flex-wrap:wrap}
.scan{border:1px dashed var(--rule-strong);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--tint)}
.scan p{margin:0;font-size:13px;color:var(--ink-2);flex:1 1 220px}
.scan .status{font-size:12.5px;color:var(--ink-2);flex-basis:100%}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.rcpt-img{display:block;max-height:140px;max-width:100%;border-radius:6px;border:1px solid var(--rule);margin-bottom:6px}
.ibx-list{display:flex;flex-direction:column}
.ibx{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.ibx:first-child{border-top:0;padding-top:0}
.ibx .th{width:48px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);background:var(--tint);display:grid;place-items:center;font-size:10.5px;color:var(--ink-3)}
.ibx .t{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ibx .d{font-size:12.5px;color:var(--ink-3)}
.ibx .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.ibx{grid-template-columns:48px minmax(0,1fr)}.ibx .acts{grid-column:2;justify-content:flex-start}}
@media (max-width:600px){#hdr-actions [data-act="new-invoice"]{display:none}#hdr-actions .btn{padding:6px 11px;font-size:13.5px}}
.hint-warn{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:8px 10px;border-radius:8px}
.hint-info{font-size:13px;color:var(--ink);background:var(--accent-soft);padding:8px 10px;border-radius:8px}
.hint-info .check{align-items:flex-start;font-size:13px}
.hint-warn.crit{color:var(--crit);background:var(--crit-soft)}
.dupline{color:var(--crit)!important}
.pill.tg{background:var(--sheet);color:var(--accent);box-shadow:inset 0 0 0 1px var(--rule-strong)}
.tg-line{font-size:12.5px;color:var(--ink-3)}
.tg-line.err{color:var(--warn)}
.sgd-out{font-family:var(--f-num);font-size:14px;padding:8px 0}
.msg{font-size:13px;color:var(--crit)}
.toast{max-width:min(520px,calc(100vw - 32px));text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:30;box-shadow:var(--shadow)}
.loading{padding:60px 0;text-align:center;color:var(--ink-3)}
@media (prefers-reduced-motion:no-preference){.overlay{animation:fade .14s ease-out}.modal{animation:rise .18s ease-out}}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(8px);opacity:.6}}
</style>

<script>
(() => {
/* ---------- constants ---------- */
const REV_CATS = [
  {name:"AI optimisation project", note:"Fixed-scope work such as a finance-function optimisation."},
  {name:"AI advisory", note:"Hourly or retainer advice, e.g. monthly advisory."},
  {name:"Other income", note:"Interest, referral fees, anything else."}
];
const EXP_CATS = [
  {name:"AI tools & software", note:"Claude, API usage, SaaS subscriptions."},
  {name:"Cloud & hosting", note:"Servers, domains, Google Workspace."},
  {name:"Meals & entertainment", note:"Client meals. Note who and why on each entry."},
  {name:"Transport", note:"Grab, taxi and MRT for client work."},
  {name:"Travel", note:"Overseas business trips: flights, hotels."},
  {name:"Admin & compliance", note:"ACRA fees, corporate secretary, accounting, registered address."},
  {name:"Bank & FX fees", note:"bank charges, transfer and conversion fees."},
  {name:"Equipment", note:"Laptops and hardware. Capital items: claim capital allowances; items up to S$5,000 each can be written off in one year (S$30,000 cap per YA)."},
  {name:"Professional fees", note:"Legal, contractors, freelancers."},
  {name:"Marketing", note:"Website, ads, events, sponsorships."},
  {name:"Other expenses", note:"Anything that fits nowhere else."}
];
const CURRENCIES = ["SGD","USD","USDT","USDC","MYR","HKD","CNY","EUR","GBP","AUD","JPY"];
const DEF = {company:"AI ARTISANS PTE. LTD.", fyeMonth:5, fyeConfirmed:false, gstRegistered:false, revenueBasis:"invoice", invoicePrefix:"AIA", incorporated:"", paymentDays:30,
  clients:[]};
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MON3 = MONTHS.map(m=>m.slice(0,3));
const GST_THRESHOLD = 1000000;

/* ---------- state ---------- */
const today = (()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")})();
const S = {entries:[], invoices:[], settings:{...DEF}, month:today.slice(0,7), period:(()=>{ try{ const v=localStorage.getItem("books-period"); return ["month","fy","cy"].includes(v)?v:"month"; }catch(e){ return "month"; } })(), view:"overview",
  inbox:[], claims:[], loaded:{entries:false,invoices:false,settings:false}, offline:false, canWrite:true,
  filters:{range:"fy", kind:"all", cat:"all", q:""}, invFilter:"open"};
let db=null, assets=null, sample=null, sampleImages=false, sampleOff=false, sampleLimits=null, downloads=null, mcp=null;

/* ---------- data: the "Books" tab of one Google Sheet, shared by this page (claude.ai), the Telegram Mini App and the receipts bot ----------

/* Transport 1: the viewer's Google Sheets connector (this page on claude.ai) */
function mcpTransport(m, sid){

  const bump = async () => { const v=new Date().toISOString()+"-"+Math.random().toString(36).slice(2,7); await call("update_values",{range:"Meta!B1", values:[[v]]}); return v; };
  return {
    async load(){ const [a,b]=await Promise.all([call("get_values",{range:"Books!A2:E"}), call("get_values",{range:"Meta!B1"})]); const rows=vals(a); index(rows); return {rows, rev:String(vals(b)[0]?.[0]||"")}; },
    async rev(){ return String(vals(await call("get_values",{range:"Meta!B1"}))[0]?.[0]||""); },
    async thumb(c,id){ const n=rowOf.get(c+"/"+id); if(!n) return null; const r=vals(await call("get_values",{range:`Books!A${n}:F${n}`}))[0]||[]; return (r[0]===c&&r[1]===id&&r[5]) ? String(r[5]) : null; },
    async put(row){

      if(n){ const chk=vals(await call("get_values",{range:`Books!A${n}:B${n}`}))[0]||[]; if(chk[0]!==row[0]||chk[1]!==row[1]) n=null; }
      if(!n){ index(vals(await call("get_values",{range:"Books!A2:B"}))); n=rowOf.get(key); }
      if(n) await call("update_values",{range:`Books!A${n}:M${n}`, values:[row]});

function gasTransport(url, initData){

function chartSVG(fy){
  const months = fyMonths(fy);
  const rows = months.map(ym=>({ym, rev:revenueIn(ym+"-01",ym+"-31"), exp:expensesIn(ym+"-01",ym+"-31")}));
  const max = Math.max(1, ...rows.map(r=>Math.max(r.rev,r.exp)));
  const step = niceStep(max/4); const top = Math.ceil(max/step)*step;
  const W=720,H=230,L=46,R=8,T=10,B=26, pw=W-L-R, ph=H-T-B, gw=pw/12, bw=Math.min(16,(gw-10)/2);

  for(let v=0; v<=top+1e-9; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${L-8}" y="${y(v)+3.5}" text-anchor="end">${short(v)}</text>`; }
  const bar=(x,v,color)=>{ if(v<=0) return ""; const h=Math.max(1.5,(v/top)*ph), yy=T+ph-h, rr=Math.min(4,bw/2,h); return `<path d="M${x},${T+ph} V${yy+rr} Q${x},${yy} ${x+rr},${yy} H${x+bw-rr} Q${x+bw},${yy} ${x+bw},${yy+rr} V${T+ph} Z" fill="${color}"/>`; };
  let b="", hits="";
  rows.forEach((r,i)=>{
    const cx = L+gw*i+gw/2;
    b += bar(cx-bw-1, r.rev, "var(--rev)") + bar(cx+1, r.exp, "var(--exp)");
    const cur = r.ym===today.slice(0,7);
    b += `<text x="${cx}" y="${H-8}" text-anchor="middle" style="${cur?"fill:var(--ink);font-weight:600":""}">${MON3[+r.ym.slice(5)-1]}</text>`;
    hits += `<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${ph}" fill="transparent" data-i="${i}" class="hit"/>`;
  });
  return {svg:`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenses by month, ${esc(fy.label)}">${g}<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--rule-strong)"/>${b}${hits}</svg>`, rows, geom:{W,L,gw,T}};

function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(raw||1))); const n=raw/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function breakdownHTML(map, color, emptyMsg){

}

      <div class="meter" role="progressbar" aria-valuenow="${gstPct.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><div style="width:${Math.max(gstPct,0.5)}%"></div></div>

    </section>
  </div>`;
  wireChart(ch);
}
function wireChart(ch){
  const box=$("#chart"), tip=$("#tip"); if(!box) return;
  box.querySelectorAll(".hit").forEach(h=>{
    const show=()=>{ const r=ch.rows[+h.dataset.i]; const bb=box.getBoundingClientRect(); const sc=bb.width/ch.geom.W;
      const x=(ch.geom.L+ch.geom.gw*(+h.dataset.i)+ch.geom.gw/2)*sc; const net=r2(r.rev-r.exp);
      tip.innerHTML=`<b>${monthLabel(r.ym)}</b><div class="row"><span><i style="background:var(--rev)"></i>Revenue</span><span>${money(r.rev)}</span></div><div class="row"><span><i style="background:var(--exp)"></i>Expenses</span><span>${money(r.exp)}</span></div><div class="row"><span>Net</span><span>${money(net)}</span></div>`;
      tip.hidden=false; const tw=tip.offsetWidth; const cx=Math.min(Math.max(x,tw/2),bb.width-tw/2); tip.style.left=cx+"px"; tip.style.top=(ch.geom.T*sc+4)+"px"; };
    h.addEventListener("mouseenter",show); h.addEventListener("click",()=>{S.month=ch.rows[+h.dataset.i].ym; S.period="month"; render();});
    h.addEventListener("mouseleave",()=>tip.hidden=true);
  });
}

/* ---------- ledger ---------- */
function ledgerRows(){
  const f=S.filters; let a="0000-01-01", b="9999-12-31";
  if(f.range==="fy"){ const fy=fyFor(today); a=fy.start; b=fy.end; }
  else if(f.range==="lastfy"){ const fy=fyFor(addDays(fyFor(today).start,-1)); a=fy.start; b=fy.end; }
  else if(f.range==="month"){ a=S.month+"-01"; b=S.month+"-31"; }
  const q=f.q.trim().toLowerCase(); const dupIds = f.kind==="dups" ? entryDupIds() : null;
  return S.entries.filter(e=>inR(e.date,a,b)
    && (f.kind==="all" || (f.kind==="dups" ? dupIds.has(e.id) : f.kind==="missing" ? (e.kind==="expense"&&!hasReceipt(e)) : e.kind===f.kind))
    && (f.cat==="all" || e.category===f.cat)
    && (!q || [e.party,e.description,e.category,e.ref,e.notes].join(" ").toLowerCase().includes(q))
  ).sort((x,y)=> x.date===y.date ? String(y.createdAt||"").localeCompare(String(x.createdAt||"")) : (x.date<y.date?1:-1));
}
function renderLedger(){

  ${rows.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>Vendor / client</th><th>Category</th><th>Source</th><th>Receipt</th><th class="r">Original</th><th class="r">Money in</th><th class="r">Money out</th></tr></thead>
    <tbody>${rows.map(e=>`<tr data-act="edit-entry" data-id="${esc(e.id)}">
      <td class="amt">${fmtDate(e.date)}</td>

      <td><span class="src">${esc(srcLabel[e.method]||"Typed")}</span>${e.kind==="expense"&&e.paidBy==="personal"?`<div class="meta">${e.claimId?(()=>{const c=S.claims.find(x=>x.id===e.claimId); return c?`${esc(c.number)}${c.status==="reimbursed"?" · repaid":""}`:"Paid personally";})():"Paid personally · to claim"}</div>`:""}</td>

      <td class="amt r">${e.currency&&e.currency!=="SGD"?esc(moneyCur(e.amount,e.currency)):""}</td>
      <td class="amt r">${e.kind==="income"?money(e.sgd,{bare:1}):""}</td>
      <td class="amt r">${e.kind==="expense"?money(e.sgd,{bare:1}):""}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="6">Totals · ${rows.length} entr${rows.length===1?"y":"ies"} · net <span class="${inc-exp<0?"neg":""}">${money(inc-exp)}</span></td><td class="amt r">${money(inc,{bare:1})}</td><td class="amt r">${money(exp,{bare:1})}</td></tr></tfoot>
  </table></div>` : `<div class="panel"><div class="empty-note">${S.entries.length?"Nothing matches these filters.":"No entries yet. Record one, scan a receipt, or send receipts and statements to Claude in chat."}</div></div>`}
  <p class="sub" style="color:var(--ink-3);font-size:12.5px;margin:0">Invoice payments appear here once marked paid. Amounts in brackets are negative. All SGD values use the rate recorded on each entry.</p>`;

  $("#flt-kind").onchange=e=>{f.kind=e.target.value;renderLedger();};

  let qt; $("#flt-q").oninput=e=>{clearTimeout(qt); qt=setTimeout(()=>{f.q=e.target.value; const pos=e.target.selectionStart; renderLedger(); const el=$("#flt-q"); el.focus(); el.setSelectionRange(pos,pos);},220);};
}

function closeModal(){ M?.ctl?.abort(); M=null; $("#modal-root").innerHTML=""; }
function openModal(html){ $("#modal-root").innerHTML=`<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; const f=$("#modal-root").querySelector("input:not([type=file]),select,button.primary"); f?.focus(); }
const val = id => $("#"+id)?.value ?? "";
/* Rate and SGD amount stay in step: whichever was typed last wins */
function wireFx(p, fieldId, initSgd, after){
  const cur=$("#"+p+"-cur"), amt=$("#"+p+"-amt"), fx=$("#"+p+"-fx"), sg=$("#"+p+"-sgdin"), ff=$("#"+fieldId), hint=$("#"+p+"-sgdhint");
  let last="fx"; if(initSgd>0 && cur.value!=="SGD"){ sg.value=(+initSgd).toFixed(2); last="sgd"; }
  const sync=src=>{
    const a=+amt.value;
    if(cur.value==="SGD"){ ff.hidden=true; hint.hidden=true; fx.value=1; sg.readOnly=true; sg.value = a>0 ? r2(a).toFixed(2) : ""; last="fx"; }
    else { ff.hidden=false; hint.hidden=false; sg.readOnly=false;
      if(src==="cur"){ if(+fx.value===1) fx.value=""; if(last==="fx") sg.value=""; }
      if(src==="fx") last="fx"; if(src==="sgd") last="sgd";
      if(last==="sgd"){ const s=+sg.value; if(a>0 && s>0) fx.value=+(s/a).toFixed(6); }
      else { const f=+fx.value; sg.value = a>0&&f>0 ? r2(a*f).toFixed(2) : ""; } }
    after&&after();
  };
  cur.addEventListener("change",()=>sync("cur")); amt.addEventListener("input",()=>sync("amt")); fx.addEventListener("input",()=>sync("fx")); sg.addEventListener("input",()=>sync("sgd"));
  M.syncFx=()=>sync("amt"); sync("init");
}
function sgdOf(p){ const a=+val(p+"-amt"); if(val(p+"-cur")==="SGD") return a>0?r2(a):0; const s=+val(p+"-sgdin"); if(s>0) return r2(s); const f=+val(p+"-fx"); return a>0&&f>0?r2(a*f):0; }
function fxOf(p){ if(val(p+"-cur")==="SGD") return 1; const a=+val(p+"-amt"), s=sgdOf(p); return a>0&&s>0 ? +(s/a).toFixed(6) : +val(p+"-fx"); }

function incomePrompt(n){ return `The attached image${n>1?"s are pages of one document":" is a document"}: a sales invoice issued by AI ARTISANS PTE. LTD. to a client, or a client's payment advice or remittance (money coming in). Reply with only one JSON object, no other text:
{"date":"YYYY-MM-DD" (invoice or payment date) or null,"dueDate":"YYYY-MM-DD" or null,"client":string or null (the customer who pays, not AI ARTISANS),"description":short string (the work billed, max 10 words),"currency":ISO code such as "SGD" or "USD" (use "USDT" for Tether),"total":number (total amount due or paid) or null,"reference":invoice number or null,"category":one of ${JSON.stringify(REV_CATS.map(c=>c.name))}}
Example: {"date":"2026-10-01","dueDate":"2026-10-31","client":"your client","description":"Finance function optimisation, phase 1","currency":"SGD","total":8000,"reference":"AIA-2026-001","category":"AI optimisation project"}`; }

const dims = im => [im.naturalWidth||im.width, im.naturalHeight||im.height];

let pdfjsP=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("script")); document.head.appendChild(s); }); }
function getPdfjs(){
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfjsP = pdfjsP || (async()=>{ await loadScript(base+"pdf.worker.min.js"); await loadScript(base+"pdf.min.js"); const lib=window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js"; return lib; })().catch(e=>{ pdfjsP=null; throw e; });

async function pdfPages(file, maxPages){
  const lib=await getPdfjs(); const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const out=[]; for(let i=1;i<=Math.min(doc.numPages,maxPages);i++){ const pg=await doc.getPage(i); const v0=pg.getViewport({scale:1}); const v=pg.getViewport({scale:Math.min(2.5,1600/Math.max(v0.width,v0.height))});
    const c=document.createElement("canvas"); c.width=Math.round(v.width); c.height=Math.round(v.height); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:x, viewport:v}).promise; out.push(c); }
  return out;
}
async function handleReceipt(file){
  if(!file || !M) return; const st=$("#scan-status"), txt=$("#scan-text");
  const isPdf = file.type==="application/pdf" || /\.pdf$/i.test(file.name||"");
  st.textContent="Saving…";
  const h=await fileHash(file); if(!M) return; M.fileHash=h;
  let saved=false, why="", im=null, pages=[];
  if(!isPdf){ try{ im=await loadImg(await readURL(file)); }catch(e){} }
  else { try{ pages=await pdfPages(file, Math.max(1,Math.min(3, sampleLimits?.images?.maxCount||3))); }catch(e){ console.warn("pdf render",e); } }
  if(!M) return;
  if(assets){ try{ const a=await assets.upload(file); if(!M) return; M.receiptAssetId=a.id; M.receiptUrl=a.url; M.receiptThumb=null; saved=true; }catch(e){ why=e?.code||"error"; console.warn("asset upload",e); } }
  const first = im || pages[0];
  if(!saved && first){ const t=thumbFrom(first); if(t && M){ M.receiptThumb=t; M.receiptAssetId=null; M.receiptUrl=null; saved=true; } }
  if(!M) return;
  if(saved){ txt.innerHTML=rcptHTML(); const b=$(".filebtn"); if(b) b.firstChild.textContent="Replace receipt"; }
  const keep = saved ? (M.kind==="income"?"Document saved. ":"Receipt saved. ") : "";
  // build images for Claude
  let imgs=[];
  if(im){ const [w,h]=dims(im); imgs=[(/^image\/(jpeg|png|webp|gif)$/.test(file.type) && file.size<8e6 && Math.max(w,h)<=4000) ? file : await toBlob(drawTo(im,1600))]; }
  else if(pages.length){ for(const c of pages){ const b=await toBlob(c); if(b) imgs.push(b); } }
  else if(/^image\/(jpeg|png|webp|gif)$/.test(file.type)) imgs=[file];
  imgs=imgs.filter(Boolean);
  if(!sample){ st.textContent = keep + "Fill in the details below, then save."; return; }
  if(sampleOff){ st.textContent = keep + "Scanning is off for now. Reload the page and choose Allow when Claude asks, or fill in the details below."; return; }
  if(!imgs.length){ st.textContent = keep + (isPdf ? "This PDF couldn't be opened for scanning. Fill in the details, or send it to Claude in chat." : "That file couldn't be read. Try a JPG or PNG photo, or fill in the details below.") + (why&&!saved?` (${why})`:""); return; }
  if(!M) return;
  M.ctl=new AbortController(); st.textContent = keep + "Claude is reading it…";
  const prompt = detectPrompt(imgs.length); let switched=false;
  try{
    const r = await sample.json(prompt,{images:imgs, signal:M.ctl.signal});
    if(!M) return;
    if(r && typeof r==="object"){
      const nf=normFields(r); if(nf.kind!==M.kind){ setKind(nf.kind); switched=true; } const incomeDoc=M.kind==="income";
      if(r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) $("#f-date").value=r.date;
      if(nf.party) $("#f-party").value=nf.party;
      if(r.description) $("#f-desc").value=String(r.description);
      if(r.reference) $("#f-ref").value=String(r.reference);
      if(r.currency){ const c=String(r.currency).toUpperCase(); if(CURRENCIES.includes(c)) $("#f-cur").value=c; }
      if(r.total!=null && !isNaN(+r.total)) $("#f-amt").value=+r.total;
      if(r.category && (incomeDoc?REV_CATS:EXP_CATS).some(c=>c.name===r.category)) $("#f-cat").value=r.category;
      if(r.gst!=null && $("#f-gst")) $("#f-gst").value=+r.gst;
      if(M.kind==="expense"){ const pb=suggestPaidBy(nf.cardLast4); if(pb && !M.keep.claimId){ setPaidBy(pb); $("#paidby-hint").textContent = pb==="personal" ? `Paid with card ending ${nf.cardLast4}, not a company card, so it's set as Paid personally.` : `Paid with the company card ending ${nf.cardLast4}.`; } }
      $("#f-cur").dispatchEvent(new Event("change")); $("#f-amt").dispatchEvent(new Event("input"));
      st.textContent = keep + (switched ? (M.kind==="income"?"This looks like money coming in, so it's set as Income. ":"This looks like an expense, so it's set as Expense. ") : "") + (val("f-cur")!=="SGD" ? "Details filled in. Check them and enter the SGD rate, then save." : "Details filled in. Check them, then save.");
    }
  }catch(e){
    if(e?.code==="cancelled") return;
    console.warn("scan",e);
    const m={not_granted:"Claude wasn't allowed to read it. Reload the page and choose Allow when asked.",sampling_disabled:"Claude isn't available on this account right now.",images_unavailable:"This view can't send images to Claude. Open the page in the Claude app or claude.ai.",rate_limited:"Too many requests right now. Try again in a minute.",invalid_json:"Couldn't read it clearly. Try a sharper photo, or fill in the details.",image_rejected:"That image couldn't be read. Try a clearer photo.",refused:"Claude couldn't read this document.",session_expired:"Sign in to Claude again, then retry.",no_key:"Scanning in the Mini App needs the Anthropic key in the Apps Script's settings. Fill in the details below for now.",upstream_error:"Claude didn't answer. Try again in a moment.",network:"Couldn't reach Google. Check your connection and try again."};
    st.textContent = keep + (m[e?.code] || `Couldn't read it (${e?.code||"error"}). Try again, or fill in the details.`);
    if(["not_granted","sampling_disabled","images_unavailable"].includes(e?.code)) sampleOff=true;

/* ---------- duplicate detection ---------- */
async function fileHash(f){ try{ const b=await crypto.subtle.digest("SHA-256", await f.arrayBuffer()); return [...new Uint8Array(b)].slice(0,16).map(x=>x.toString(16).padStart(2,"0")).join(""); }catch(e){ return null; } }
const normKey = r => String(r||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const dayDiff = (a,b) => Math.abs((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/864e5);
function dupMatches(c, pool){
  const out=[];
  for(const x of pool){
    if(x.id===c.id || (x.kind||"expense")!==(c.kind||"expense")) continue;
    let level=null, reason="";
    const sameAmt = (c.amount!=null && x.amount!=null && (c.currency||"SGD")===(x.currency||"SGD") && Math.abs(c.amount-x.amount)<0.01) || (+c.sgd>0 && +x.sgd>0 && Math.abs(c.sgd-x.sgd)<0.01);
    const rc=normKey(c.ref), rx=normKey(x.ref), d=(c.date&&x.date)?dayDiff(c.date,x.date):99;
    if(c.fileHash && x.fileHash===c.fileHash){ level="strong"; reason="Same file uploaded before"; }
    else if(rc.length>=3 && rc===rx && (sameAmt || normKey(c.party)===normKey(x.party))){ level="strong"; reason="Same receipt number"; }
    else if(sameAmt && d===0){ level="strong"; reason="Same amount on the same day"; }
    else if(sameAmt && d<=3){ const n=Math.round(d); level="possible"; reason=`Same amount, ${n} day${n===1?"":"s"} apart`; }
    if(level) out.push({x,level,reason});
  }
  return out.sort((a,b)=>(a.level==="strong"?0:1)-(b.level==="strong"?0:1));
}
function inboxCand(it){ const f=it.fields||{}; const cur=f.currency||"SGD"; return {id:it.id, kind:f.kind||"expense", date:f.date, amount:f.amount, currency:cur, sgd:cur==="SGD"?f.amount:(+f.sgdAmount>0?+f.sgdAmount:null), ref:f.ref, party:f.party, fileHash:it.fileHash, _src:"inbox", _created:it.createdAt}; }
function inboxDups(it){
  const c=inboxCand(it);
  const earlier=S.inbox.filter(o=>o.id!==it.id && String(o.createdAt||"")<String(it.createdAt||"")).map(inboxCand);
  return dupMatches(c, [...S.entries.map(e=>({...e,_src:"books"})), ...earlier]);
}
function entryDupIds(){ const ids=new Set(); const ex=S.entries.filter(e=>e.kind==="expense"||e.kind==="income");
  for(const e of ex){ if(ids.has(e.id)) continue; const m=dupMatches(e, ex); if(m.length){ ids.add(e.id); m.forEach(k=>ids.add(k.x.id)); } } return ids; }
const dupLabel = m => `${fmtDate(m.x.date)} · ${m.x.party||m.x.description||"entry"} · ${m.x.currency&&m.x.currency!=="SGD"?moneyCur(m.x.amount,m.x.currency):money(m.x.sgd??m.x.amount)}`;

function invoiceMatch(e){
  const open=S.invoices.filter(i=>i.status!=="void" && !i.entryId);
  const rk=normKey(e.ref); if(rk.length>=3){ const byRef=open.find(i=>normKey(i.number)===rk); if(byRef) return byRef; }

async function prepFile(file){

  else { try{ pages=await pdfPages(file, Math.max(1,Math.min(3, sampleLimits?.images?.maxCount||3))); }catch(e){ console.warn("pdf render",e); } }
  const first=im||pages[0]; const thumb=first?thumbFrom(first):null;

  else if(pages.length){ for(const c of pages){ const b=await toBlob(c); if(b) imgs.push(b); } }

  toast(keep.length ? `Reading ${keep.length} receipt${keep.length>1?"s":""}…${skipped?` Skipped ${skipped} already uploaded.`:""}` : `Skipped ${skipped} receipt${skipped>1?"s":""}: already uploaded.`);
  for(const [f,h] of keep){
    const ref=db.collection("inbox").doc();

async function handleInvoiceDoc(file){
  if(!file||!M) return; const st=$("#iscan-status"); st.textContent="Saving…";
  const p=await prepFile(file); if(!M) return;
  let saved=false, why="";
  if(assets){ try{ const a=await assets.upload(file); if(!M) return; M.receiptAssetId=a.id; M.receiptUrl=a.url; M.receiptThumb=null; saved=true; }catch(e){ why=e?.code||"error"; } }
  if(!saved && p.thumb){ M.receiptThumb=p.thumb; M.receiptAssetId=null; M.receiptUrl=null; saved=true; }
  if(!M) return;
  if(saved){ $("#iscan-text").innerHTML=rcptHTML(); const b=$(".modal .filebtn"); if(b) b.firstChild.textContent="Replace PDF"; }
  const keep=saved?"Invoice saved. ":"";
  if(!saved && !p.imgs.length){ st.textContent="That file couldn't be opened"+(why?` (${why})`:"")+". Try a PDF, JPG or PNG."; return; }
  if(!sample || sampleOff || !p.imgs.length){ st.textContent=keep+"Fill in the details below, then save."; return; }
  M.ctl=new AbortController(); st.textContent=keep+"Claude is reading it…";
  try{
    const r=await sample.json(incomePrompt(p.imgs.length),{images:p.imgs, signal:M.ctl.signal}); if(!M) return;
    if(r && typeof r==="object"){
      if(r.reference && !M.id) $("#i-no").value=String(r.reference);
      if(r.client) $("#i-client").value=String(r.client);
      if(r.description) $("#i-desc").value=String(r.description);
      if(r.date && /^\d{4}-\d{2}-\d{2}$/.test(r.date)) $("#i-issue").value=r.date;
      if(r.dueDate && /^\d{4}-\d{2}-\d{2}$/.test(r.dueDate)) $("#i-due").value=r.dueDate;
      if(r.category && REV_CATS.some(c=>c.name===r.category)) $("#i-stream").value=r.category;
      if(r.currency){ const c=String(r.currency).toUpperCase(); if(CURRENCIES.includes(c)) $("#i-cur").value=c; }
      if(r.total!=null && !isNaN(+r.total)) $("#i-amt").value=+r.total;
      $("#i-cur").dispatchEvent(new Event("change")); $("#i-amt").dispatchEvent(new Event("input"));
      st.textContent=keep+"Details filled in. Check them, then save.";
    }
  }catch(e){ if(e?.code==="cancelled") return; if(["not_granted","sampling_disabled","images_unavailable"].includes(e?.code)) sampleOff=true;
    st.textContent=keep+(SCAN_ERR[e?.code]||`Couldn't read it (${e?.code||"error"}). Fill in the details.`); }
}
async function saveInvoice(){
  const msg=$("#i-msg"); msg.textContent="";
  const cur=val("i-cur"), amt=+val("i-amt"), sgd=sgdOf("i"), fx=fxOf("i");
  if(!val("i-no").trim()) return msg.textContent="Add an invoice number.";
  if(!val("i-client").trim()) return msg.textContent="Add the client.";
  if(!(amt>0)) return msg.textContent="Enter an amount above zero.";
  if(!(sgd>0) || !(fx>0)) return msg.textContent="Enter the exchange rate or the amount in SGD.";
  const dup=S.invoices.find(i=>i.number===val("i-no").trim() && i.id!==M.id); if(dup) return msg.textContent="That invoice number is already used.";
  const doc={number:val("i-no").trim(), status:val("i-status"), client:val("i-client").trim(), stream:val("i-stream"), description:val("i-desc").trim(),
    issueDate:val("i-issue"), dueDate:val("i-due"), currency:cur, amount:r2(amt), fxRate:fx, sgd, updatedAt:new Date().toISOString(), createdAt:M.createdAt||new Date().toISOString()};
  if(M.paid){ doc.paidDate=M.paidDate; doc.paidSgd=M.paidSgd; doc.entryId=M.entryId; }
  if(M.receiptAssetId){ doc.receiptAssetId=M.receiptAssetId; doc.receiptUrl=M.receiptUrl; } else if(M.receiptThumb) doc.receiptThumb=M.receiptThumb;
  const btn=$('[data-act="save-invoice"]'); btn.disabled=true;
  try{ await (M.id?db.collection("invoices").doc(M.id):db.collection("invoices").doc()).set(doc); const wasNew=!M.id; closeModal(); toast(wasNew?"Invoice created":"Invoice updated"); }
  catch(e){ btn.disabled=false; msg.textContent="Couldn't save. Check your connection and try again."; }
}

async function savePaid(){
  const inv=S.invoices.find(i=>i.id===M.id); if(!inv) return closeModal();
  const d=val("p-date"), sgd=r2(+val("p-sgd")); if(!d||!(sgd>0)) return $("#p-msg").textContent="Enter the date and the SGD amount received.";
  const btn=$('[data-act="save-paid"]'); btn.disabled=true;
  try{
    const ref=db.collection("entries").doc();
    await ref.set({kind:"income", date:d, party:inv.client, description:`Payment for ${inv.number}${inv.description?" · "+inv.description:""}`, category:inv.stream||"AI advisory",
      ref:inv.number, currency:"SGD", amount:sgd, fxRate:1, sgd, method:"invoice", invoiceId:inv.id, notes:"", createdAt:new Date().toISOString()});
    await db.collection("invoices").doc(inv.id).update({status:"paid", paidDate:d, paidSgd:sgd, entryId:ref.id, updatedAt:new Date().toISOString()});
    closeModal(); toast(`${inv.number} marked paid`);

}

const personalOpen = () => S.entries.filter(e=>e.kind==="expense" && e.paidBy==="personal" && !e.claimId).sort((a,b)=>a.date<b.date?-1:1);
const claimItems = c => S.entries.filter(e=>e.claimId===c.id).sort((a,b)=>a.date<b.date?-1:1);
const claimTotal = c => r2(claimItems(c).reduce((t,e)=>t+(+e.sgd||0),0));
function owedToDirector(){ const unclaimed=r2(personalOpen().reduce((t,e)=>t+(+e.sgd||0),0)); const claimed=r2(S.claims.filter(c=>c.status!=="reimbursed").reduce((t,c)=>t+claimTotal(c),0)); return {unclaimed, claimed, total:r2(unclaimed+claimed)}; }

async function createClaim(){
  const items=personalOpen().filter(e=>claimSel.has(e.id)); if(!items.length) return;
  const ref=db.collection("claims").doc(); const total=r2(items.reduce((t,e)=>t+(+e.sgd||0),0)); const number=nextClaimNo();
  await ref.set({number, date:today, status:"submitted", total, createdAt:new Date().toISOString()});
  for(const e of items){ await db.collection("entries").doc(e.id).update({claimId:ref.id, updatedAt:new Date().toISOString()}); }
  claimSel.clear(); claimOpen.add(ref.id); return number;
}

async function exportCSV(){
  const rows=ledgerRows();
  const head=["Date","Type","Vendor/Client","Description","Category","Currency","Amount","Rate to SGD","SGD","GST (SGD)","Source","Reference","Receipt","Paid by","Claim","Notes"];
  const q=v=>{ v=v==null?"":String(v); return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v; };
  const lines=[head.join(",")].concat(rows.map(e=>[e.date,e.kind==="income"?"Income":"Expense",e.party,e.description,e.category,e.currency,e.amount,e.fxRate,e.sgd,e.gst??"",e.method,e.ref,(e.receiptUrl||e.receiptThumb)?"Attached":e.receiptOnFile?"On file":e.kind==="expense"?"Missing":"",e.kind==="expense"?(e.paidBy==="personal"?"Director (personal)":"Company"):"",e.claimId?((S.claims.find(c=>c.id===e.claimId)||{}).number||""):"",e.notes].map(q).join(",")));
  const name=`ai-artisans-cash-book-${S.filters.range==="month"?S.month:S.filters.range==="lastfy"?"last-fy":S.filters.range==="fy"?fyFor(today).label.replace(/\s+/g,"-").toLowerCase():"all"}.csv`;
  try{ await downloads.save({filename:name, data:lines.join("\n")}); toast("CSV saved"); }
  catch(e){ if(e?.code!=="declined") toast("Export isn't available here."); }
}

document.addEventListener("click", async ev=>{
  if(ev.target.closest("[data-stop]")) return;
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="overlay"){ if(ev.target===el) closeModal(); return; }
  if(a==="close") return closeModal();
  if(a==="period"){ S.period=el.dataset.k; try{ localStorage.setItem("books-period",S.period); }catch(e){} return render(); }
  if(a==="month-now"){ S.month=today.slice(0,7); return render(); }
  if(a==="month"){ S.month=shiftMonth(S.month,+el.dataset.k); return render(); }
  if(a==="new-entry"){ if(!db) return; return entryModal(null,{scan:!!el.dataset.scan}); }
  if(a==="new-invoice"){ if(!db) return; return invoiceModal(null); }
  if(a==="edit-entry"){ if(!S.canWrite||!db) return; const e=S.entries.find(x=>x.id===el.dataset.id); if(e){ entryModal(e); if(e.receiptThumb===LAZY_THUMB) fillThumb("entries",e.id); } return; }
  if(a==="edit-invoice"){ if(ev.target.closest("button")) return; if(!S.canWrite||!db) return; const i=S.invoices.find(x=>x.id===el.dataset.id); if(i){ invoiceModal(i); if(i.receiptThumb===LAZY_THUMB) fillThumb("invoices",i.id); } return; }
  if(a==="show-dups"){ ev.preventDefault(); S.filters={range:"all",kind:"dups",cat:"all",q:""}; location.hash="ledger"; S.view="ledger"; return render(); }
  if(a==="show-missing"){ ev.preventDefault(); S.filters={range:"fy",kind:"missing",cat:"all",q:""}; location.hash="ledger"; S.view="ledger"; return render(); }
  if(a==="kind"){ setKind(el.dataset.k); return; }
  if(a==="kind-old"){ M.kind=el.dataset.k; document.querySelectorAll('[data-act="kind"]').forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===M.kind));
    $("#f-cat").innerHTML=(M.kind==="income"?REV_CATS:EXP_CATS).map(c=>`<option>${esc(c.name)}</option>`).join("");
    if(!(M.receiptUrl||M.receiptThumb)) $("#scan-text").innerHTML=rcptHTML(); $("#l-onfile").textContent=(M.kind==="income"?"Invoice or payment advice":"Receipt")+" on file elsewhere (email, paper)"; $("#l-party").textContent=M.kind==="income"?"Client":"Vendor"; return; }
  if(a==="save-entry") return saveEntry(!!el.dataset.next);
  if(a==="review-inbox") return reviewInbox(el.dataset.id);
  if(a==="paidby"){ if(M.keep?.claimId && el.dataset.v==="company"){ $("#paidby-hint").textContent="This expense is in a claim. Delete the claim first to change who paid."; return; } setPaidBy(el.dataset.v); return; }
  if(a==="claim-create"){ el.disabled=true; try{ const n=await createClaim(); if(n) toast(`${n} created`); }catch(e){ el.disabled=false; toast("Couldn't create the claim. Try again."); } return; }
  if(a==="claim-toggle"){ const id=el.dataset.id; claimOpen.has(id)?claimOpen.delete(id):claimOpen.add(id); return renderClaims(); }
  if(a==="claim-csv"){ const c=S.claims.find(x=>x.id===el.dataset.id); if(c) claimCSV(c); return; }
  if(a==="claim-paid"){ const c=S.claims.find(x=>x.id===el.dataset.id); if(c) claimPaidModal(c); return; }
  if(a==="claim-paid-save"){ const d=val("cr-date"), amt=r2(+val("cr-amt")); if(!d||!(amt>0)) return $("#cr-msg").textContent="Enter the date and amount paid."; el.disabled=true;
    try{ await db.collection("claims").doc(M.id).update({status:"reimbursed", reimbursedDate:d, reimbursedSgd:amt, updatedAt:new Date().toISOString()}); closeModal(); toast("Claim marked reimbursed"); }catch(e){ el.disabled=false; $("#cr-msg").textContent="Couldn't save. Try again."; } return; }
  if(a==="claim-unpay"){ el.disabled=true; try{ await db.collection("claims").doc(el.dataset.id).update({status:"submitted", reimbursedDate:null, reimbursedSgd:null}); toast("Back to awaiting payment"); }catch(e){ el.disabled=false; toast("Couldn't update. Try again."); } return; }
  if(a==="claim-delete"){ if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Confirm delete"; el.classList.add("danger"); return; }
    el.disabled=true; const c=S.claims.find(x=>x.id===el.dataset.id); if(!c) return;
    try{ for(const e of claimItems(c)) await db.collection("entries").doc(e.id).update({claimId:null});
      await db.collection("claims").doc(c.id).delete(); toast(`${c.number} deleted. Its items are back in Not yet claimed.`); }catch(e){ el.disabled=false; toast("Couldn't delete. Try again."); } return; }
  if(a==="link-inv"||a==="inv-from-entry"||a==="no-invoice"){ const e=S.entries.find(x=>x.id===el.dataset.e); if(!e) return; el.disabled=true;
    try{ if(a==="link-inv"){ const inv=S.invoices.find(i=>i.id===el.dataset.i); if(!inv) return; await linkEntryToInvoice(e,inv); toast(`Linked to ${inv.number} and marked paid`); }
      else if(a==="inv-from-entry"){ const n=await invoiceFromEntry(e); toast(`Added ${n} as a paid invoice`); }
      else { await db.collection("entries").doc(e.id).update({noInvoice:true}); toast("Marked as not invoiced"); } }
    catch(err){ el.disabled=false; toast("Couldn't update. Try again."); } return; }
  if(a==="attach-dup"){ const x=S.entries.find(e=>e.id===el.dataset.id); if(!x||!M) return; el.disabled=true;
    const patch={updatedAt:new Date().toISOString()}; if(M.receiptAssetId){ patch.receiptAssetId=M.receiptAssetId; patch.receiptUrl=M.receiptUrl; } else if(M.receiptThumb) patch.receiptThumb=M.receiptThumb;
    if(M.fileHash) patch.fileHash=M.fileHash; if(!x.ref && val("f-ref")) patch.ref=val("f-ref").trim(); if(!x.gst && $("#f-gst") && val("f-gst")) patch.gst=r2(+val("f-gst"));
    if(M.tgRowId && !x.tgRowId) patch.tgRowId=M.tgRowId;
    const inb=M.inboxId, tgRid=M.tgRowId;
    try{ await db.collection("entries").doc(x.id).update(patch); if(inb){ try{ await db.collection("inbox").doc(inb).delete(); }catch(e){} S.inbox=S.inbox.filter(i=>i.id!==inb); if(tgRid) tgMark(tgRid,"saved"); }
      closeModal(); toast("Receipt attached to the existing entry"); const n=inb&&nextReviewable(inb); if(n) reviewInbox(n.id); }
    catch(e){ el.disabled=false; toast("Couldn't attach. Try again."); } return; }
  if(a==="review-next"){ const n=nextReviewable(); if(n) reviewInbox(n.id); return; }
  if(a==="rescan-inbox"){ el.disabled=true; return rescanInbox(el.dataset.id); }
  if(a==="discard-inbox"){ if(el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="Confirm discard"; el.classList.add("danger"); return; }
    el.disabled=true; const id=el.dataset.id; const it=S.inbox.find(x=>x.id===id); try{ await db.collection("inbox").doc(id).delete(); S.inbox=S.inbox.filter(x=>x.id!==id); if(it?.source==="telegram") tgMark(it.tgRowId||id,"discarded"); if(M&&M.inboxId===id) closeModal(); toast("Receipt discarded"); schedule(); }catch(e){ el.disabled=false; toast("Couldn't discard. Try again."); } return; }
  if(a==="retry-load") return location.reload();
  if(a==="save-invoice") return saveInvoice();
  if(a==="save-paid") return savePaid();
  if(a==="mark-paid"){ const i=S.invoices.find(x=>x.id===el.dataset.id); if(i) paidModal(i); return; }
  if(a==="mark-sent"){ el.disabled=true; try{ await db.collection("invoices").doc(el.dataset.id).update({status:"sent",updatedAt:new Date().toISOString()}); toast("Marked as sent"); }catch(e){ el.disabled=false; toast("Couldn't update. Try again."); } return; }
  if(a==="del-entry") return confirmDelete(el, ()=>db.collection("entries").doc(M.id).delete());
  if(a==="del-invoice") return confirmDelete(el, async()=>{ if(M.entryId) await db.collection("entries").doc(M.entryId).delete(); await db.collection("invoices").doc(M.id).delete(); });
  if(a==="inv-filter"){ S.invFilter=el.dataset.k; return renderInvoices(); }
  if(a==="export") return exportCSV();
  if(a==="gst"){ S._saveSettings?.({gstRegistered:el.dataset.v==="1"}); return renderSetup(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && M) closeModal(); });

/* ---------- routing / render ---------- */
const VIEWS=["overview","ledger","invoices","claims","setup"];
function route(){ const h=location.hash.replace("#",""); S.view=VIEWS.includes(h)?h:"overview"; render(); }
window.addEventListener("hashchange", route);
function render(){
  renderHeader();
  if(S.offline){ $("#main").innerHTML=`<div class="panel"><h3>The books can't load</h3><p class="sub">${esc(S.offlineMsg||"Open this page in Claude while signed in, or from the AI Artisans Receipts bot in Telegram.")}</p>${ENV!=="none"?`<div class="actions"><button class="btn" data-act="retry-load">Try again</button></div>`:""}</div>`; return; }
  if(!(S.loaded.entries&&S.loaded.invoices&&S.loaded.settings)){ if(!$("#main").children.length) $("#main").innerHTML=`<div class="panel"><p class="sub">Loading the books from Google Sheets…</p></div>`; return; }
  if(M) return; // don't redraw behind an open form
  ({overview:renderOverview, ledger:renderLedger, invoices:renderInvoices, claims:renderClaims, setup:renderSetup})[S.view]();
}
let pending=false; function schedule(){ if(pending) return; pending=true; requestAnimationFrame(()=>{pending=false; render();}); }

/* ---------- boot ---------- */
(async()=>{
  { const h=location.hash.replace("#",""); S.view=VIEWS.includes(h)?h:"overview"; }
  renderHeader();
  const fail = e => { console.warn("books load",e); S.offline=true; S.offlineMsg=loadErrMsg(e); render(); };
  if(ENV==="telegram"){
    try{ TGW.ready(); TGW.expand(); }catch(e){}
    const theme=()=>{ document.documentElement.dataset.theme = TGW.colorScheme==="dark" ? "dark" : "light"; };
    theme(); try{ TGW.onEvent("themeChanged", theme); }catch(e){}
    if(!MINIAPP_API) return fail({code:"no_api"});
    const gt=gasTransport(MINIAPP_API, TGW.initData);
    Store.start(gt);
    sample=gasSample(gt); sampleImages=true; sampleLimits={images:{maxCount:3}};
  } else if(ENV==="claude"){
    mcp = await window.claude.use("mcp").catch(()=>null);
    if(!mcp) return fail({code:"no_mcp"});
    Store.start(mcpTransport(mcp, BOOKS_SHEET_ID));
    window.claude.use("assets").then(a=>{assets=a;}).catch(()=>{});
    window.claude.use("downloads").then(d=>{downloads=d; if(S.view==="ledger") schedule();}).catch(()=>{});
    window.claude.use("sample").then(async s=>{ sample=s; if(!s) return; try{ const l=await s.limits(); sampleLimits=l; sampleImages=!!l?.images; }catch(e){ sampleImages=true; } }).catch(()=>{});
  } else return fail({code:"no_env"});
  db = Store.db;
  db.collection("entries").onSnapshot(s=>{ S.entries=s.docs.map(d=>({id:d.id,...d.data()})); S.loaded.entries=true; schedule(); });
  db.collection("claims").onSnapshot(s=>{ S.claims=s.docs.map(d=>({id:d.id,...d.data()})); schedule(); });
  db.collection("inbox").onSnapshot(s=>{ S.inbox=s.docs.map(d=>({id:d.id,...d.data()})); S.loaded.inbox=true; schedule(); });
  db.collection("invoices").onSnapshot(s=>{ S.invoices=s.docs.map(d=>({id:d.id,...d.data()})); S.loaded.invoices=true; schedule(); });
  db.doc("config/settings").onSnapshot(s=>{ S.settings={...DEF,...(s.exists?s.data():{})}; S.loaded.settings=true; schedule(); });
  Store.load().catch(fail);
})();
function loadErrMsg(e){
  const c=e?.code||"";
  return ({
    no_env:"Open this page in Claude while signed in, or from the AI Artisans Receipts bot in Telegram.",
    no_mcp:"The books are kept in your Google Sheet, so this page needs your Google Sheets connection. Reload the page and choose Allow when asked.",
    not_in_manifest:"This page isn't allowed to use Google Sheets. Reload the page and choose Allow when asked.",
    approval_required:"Google Sheets needs your approval. Reload the page and choose Allow when asked.",
    not_granted:"Google Sheets wasn't allowed. Reload the page and choose Allow when asked.",
    server_not_connected:"Add the Google Sheets connector in claude.ai Settings › Connectors, then reload this page.",
    needs_reauth:"Reconnect Google Sheets in claude.ai Settings › Connectors, then reload this page.",
    selection_required:"You have more than one Google Sheets connection. Choose one when claude.ai asks, then try again.",
    tool_error:"Google Sheets couldn't open the books' Sheet. Check that your Google account can open “AI Artisans Books”.",
    not_allowed:"This Telegram account isn't allowed to open the books.",
    no_api:"The Mini App isn't linked to the Sheet yet.",
    network:"Couldn't reach Google. Check your connection and try again."
  })[c] || `Couldn't load the books (${c||"error"}). Try again in a moment.`;
}
// re-render after closing a modal so new data shows
const mo=new MutationObserver(()=>{ if(!M && !$("#modal-root").children.length) schedule(); }); mo.observe($("#modal-root"),{childList:true});
})();
</script>

</body></html>
